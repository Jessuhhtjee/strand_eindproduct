<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mijn tropische strand</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="app.js" defer></script>
  <script src="script.js"></script>
</head>

<body>
<a-scene
  background="color: #65D9FF"
  shadow="type: pcfsoft"
  renderer="shadows: true">


  <a-entity camera look-controls wasd-controls position="0 2 10">
    <a-entity
      cursor="rayOrigin: mouse; fuse: false"
      raycaster="objects: .clickable; far: 100"
      position="0 0 -1"
      geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
      material="color: black; shader: flat">
    </a-entity>
  </a-entity>


  <a-entity
    light="type: ambient; color: #FFFFFF; intensity: 0.8">
  </a-entity>


  <a-entity
    light="type: directional;
           color: #FFF4D6;
           intensity: 1.5;
           castShadow: true;
           shadowMapWidth: 2048;
           shadowMapHeight: 2048"
    position="-8 15 6"
    rotation="-45 -25 0">
  </a-entity>

  <a-entity
    light="type: hemisphere;
           color: #D7F4FF;
           groundColor: #D8B879;
           intensity: 0.35">
  </a-entity>

  <!-- zon -->
  <a-sphere
    position="12 14 -35"
    radius="2.5"
    color="#FFD447"
    material="emissive: #FFB900; emissiveIntensity: 0.7">
  </a-sphere>

  <!-- zand -->
  <a-plane
    position="0 0 0"
    width="100"
    height="40"
    rotation="-90 0 0"
    color="#F4D995"
    shadow="receive: true">
  </a-plane>

  <!-- zee -->
  <a-plane
    position="0 -0.03 -40"
    width="100"
    height="40"
    rotation="-90 0 0"
    color="#16BDEB"
    shadow="receive: true">
  </a-plane>

  <!-- golven -->
  <a-box
    position="-12 0.025 -25"
    width="5"
    height="0.025"
    depth="0.12"
    color="#D9FAFF"
    animation="property: position;
      from: -14 0.025 -25;
      to: -9 0.025 -25;
      dir: alternate;
      dur: 2500;
      loop: true;
      easing: easeInOutSine">
  </a-box>

  <a-box
    position="5 0.025 -30"
    width="7"
    height="0.025"
    depth="0.12"
    color="#B9F5FF"
    animation="property: position;
      from: 3 0.025 -30;
      to: 8 0.025 -30;
      dir: alternate;
      dur: 3200;
      loop: true;
      easing: easeInOutSine">
  </a-box>

  <a-box position="20 0.025 -38"
    width="4" height="0.025" depth="0.12"
    color="#E0FAFF">
  </a-box>

  <a-box position="-25 0.025 -45"
    width="8" height="0.025" depth="0.12"
    color="#B9F5FF">
  </a-box>

  <!-- wolken -->
  <a-sphere position="-10 9 -25" radius="1.5"
    scale="1.5 0.6 0.8" color="#FFFFFF">
  </a-sphere>

  <a-sphere position="-8 9.5 -25" radius="1.5"
    scale="1.2 0.7 0.8" color="#FFFFFF">
  </a-sphere>

  <a-sphere position="1 11 -38" radius="1.5"
    scale="1.7 0.6 0.8" color="#FFFFFF">
  </a-sphere>

  <a-sphere position="4 11 -38" radius="1.5"
    scale="1.2 0.7 0.8" color="#FFFFFF">
  </a-sphere>

  <a-sphere position="20 8 -28" radius="1.4"
    scale="1.5 0.6 0.8" color="#FFFFFF">
  </a-sphere>

  <!-- boom links -->
  <a-cylinder position="-13 2.5 -8"
    radius="0.28" height="5"
    color="#94602F" rotation="0 0 -7"
    shadow="cast: true">
  </a-cylinder>

  <a-cone position="-14.5 5 -8"
    radius-bottom="2.1" radius-top="0.1"
    height="1.2" rotation="0 0 65"
    color="#28A745" shadow="cast: true">
  </a-cone>

  <a-cone position="-12 5.1 -8"
    radius-bottom="2.1" radius-top="0.1"
    height="1.2" rotation="0 0 -65"
    color="#168C43" shadow="cast: true">
  </a-cone>

  <a-cone position="-13 5.7 -8"
    radius-bottom="2" radius-top="0.1"
    height="1.1" color="#32CD59"
    shadow="cast: true">
  </a-cone>

  <a-cone position="-13 5.1 -8"
    radius-bottom="2" radius-top="0.1"
    height="1.1" rotation="90 0 0"
    color="#168C43" shadow="cast: true">
  </a-cone>

  <!-- boom rechts -->
  <a-cylinder position="14 2.5 -12"
    radius="0.3" height="5"
    color="#94602F" rotation="0 0 6"
    shadow="cast: true">
  </a-cylinder>

  <a-cone position="13 5.2 -12"
    radius-bottom="2" radius-top="0.1"
    height="1.2" rotation="0 0 55"
    color="#32CD59" shadow="cast: true">
  </a-cone>

  <a-cone position="15 5.2 -12"
    radius-bottom="2" radius-top="0.1"
    height="1.2" rotation="0 0 -55"
    color="#168C43" shadow="cast: true">
  </a-cone>

  <a-cone position="14 5.7 -12"
    radius-bottom="2" radius-top="0.1"
    height="1.2" color="#28A745"
    shadow="cast: true">
  </a-cone>

  <a-cone position="14 5.2 -12"
    radius-bottom="2" radius-top="0.1"
    height="1.1" rotation="90 0 0"
    color="#168C43" shadow="cast: true">
  </a-cone>

  <!-- parasol -->
  <a-cylinder position="-4 1.2 0"
    radius="0.08" height="2.4"
    color="#FFFFFF" shadow="cast: true">
  </a-cylinder>

  <a-cone position="-4 2.5 0"
    radius-bottom="1.5" radius-top="0.08"
    height="0.7" color="#FF4D6D"
    shadow="cast: true">
  </a-cone>

  

<!-- stoel links -->
<a-entity position="-2.8 0 1">


  <a-box position="0 0.4 0"
    width="1.2" height="0.1" depth="1.2"
    color="#FF5964" shadow="cast: true">
  </a-box>


  <a-box position="0 0.6 0.8"
    width="1.2" height="0.1" depth="0.9"
    rotation="-25 0 0"
    color="#FF5964" shadow="cast: true">
  </a-box>


  <a-box position="-0.5 0.2 0.45"
    width="0.07" height="0.4" depth="0.07"
    color="#8B5A2B"></a-box>

  <a-box position="0.5 0.2 0.45"
    width="0.07" height="0.4" depth="0.07"
    color="#8B5A2B"></a-box>

  <a-box position="-0.5 0.2 -0.45"
    width="0.07" height="0.4" depth="0.07"
    color="#8B5A2B"></a-box>

  <a-box position="0.5 0.2 -0.45"
    width="0.07" height="0.4" depth="0.07"
    color="#8B5A2B"></a-box>

</a-entity>


<!-- stoel rechts -->
<a-entity position="2 0 1">


  <a-box position="0 0.4 0"
    width="1.2" height="0.1" depth="1.2"
    color="#3B82F6" shadow="cast: true">
  </a-box>


  <a-box position="0 0.6 0.8"
    width="1.2" height="0.1" depth="0.9"
    rotation="-25 0 0"
    color="#3B82F6" shadow="cast: true">
  </a-box>


  <a-box position="-0.5 0.2 0.45"
    width="0.07" height="0.4" depth="0.07"
    color="#8B5A2B"></a-box>

  <a-box position="0.5 0.2 0.45"
    width="0.07" height="0.4" depth="0.07"
    color="#8B5A2B"></a-box>

  <a-box position="-0.5 0.2 -0.45"
    width="0.07" height="0.4" depth="0.07"
    color="#8B5A2B"></a-box>

  <a-box position="0.5 0.2 -0.45"
    width="0.07" height="0.4" depth="0.07"
    color="#8B5A2B"></a-box>

</a-entity>




  <a-entity
    light="type: spot;
           color: #FFF2B0;
           intensity: 5;
           angle: 32;
           penumbra: 0.65;
           distance: 10;
           decay: 1"
    position="3 5 -4"
    rotation="-90 0 0">
  </a-entity>


  <a-entity
    position="3 2 -4"
    animation__float="property: position;
      from: 3 1.5 -4;
      to: 3 3.5 -4;
      dir: alternate;
      dur: 1500;
      loop: true;
      easing: easeInOutSine">


    <a-entity
      animation="property: rotation;
        from: 0 0 0;
        to: 0 360 0;
        dur: 1800;
        loop: true;
        easing: linear">

      <a-sphere
        radius="0.7"
        color="#FFD447"
        material="roughness: 0.4"
        shadow="cast: true">
      </a-sphere>

      <a-torus radius="0.48"
        radius-tubular="0.09"
        color="#FF3030">
      </a-torus>

      <a-torus radius="0.48"
        radius-tubular="0.09"
        color="#1677FF"
        rotation="90 0 0">
      </a-torus>

      <a-torus radius="0.48"
        radius-tubular="0.06"
        color="#FFFFFF"
        rotation="0 90 0">
      </a-torus>

      <a-cylinder
        radius="0.12"
        height="1.35"
        color="#20C85A"
        rotation="0 0 90">
      </a-cylinder>

    </a-entity>
  </a-entity>


  <a-box position="7 0.45 0"
    width="2" height="0.9" depth="2"
    color="#E8C47A" shadow="cast: true">
  </a-box>

  <a-cylinder position="6.3 1.1 -0.5"
    radius="0.3" height="1.3"
    color="#D9B56F" shadow="cast: true">
  </a-cylinder>

  <a-cone position="6.3 1.9 -0.5"
    radius-bottom="0.42" radius-top="0"
    height="0.5" color="#B96F45"
    shadow="cast: true">
  </a-cone>

  <a-cylinder position="7.7 1.1 -0.5"
    radius="0.3" height="1.3"
    color="#D9B56F" shadow="cast: true">
  </a-cylinder>

  <a-cone position="7.7 1.9 -0.5"
    radius-bottom="0.42" radius-top="0"
    height="0.5" color="#B96F45"
    shadow="cast: true">
  </a-cone>

  <a-box position="7 0.4 1.05"
    width="0.5" height="0.9" depth="0.12"
    color="#70452B">  
  </a-box>


  <a-sphere position="-6 0.12 -2"
    radius="0.18" scale="1.2 0.45 0.7"
    color="#FFB7C5">
  </a-sphere>

  <a-sphere position="5 0.12 -4"
    radius="0.15" scale="1.2 0.45 0.7"
    color="#FFF0C2">
  </a-sphere>

  <a-sphere position="9 0.12 3"
    radius="0.18" scale="1.2 0.45 0.7"
    color="#F6A6C1">
  </a-sphere>


  <a-entity
    id="interactiveShell"
    position="0 0.2 -5"
    throw-shell>

    <a-sphere
      class="clickable"
      radius="0.32"
      scale="1 0.45 0.8"
      color="#FF8EB7"
      material="roughness: 0.35"
      shadow="cast: true">
    </a-sphere>

    <a-torus
      radius="0.23"
      radius-tubular="0.035"
      color="#FFD76A"
      rotation="90 0 0"
      scale="1 1 0.65">
    </a-torus>

    <a-sphere
      position="0 0.12 0"
      radius="0.09"
      color="#FFFFFF">
    </a-sphere>

  </a-entity>


  <a-entity
    gltf-model="Assets/ship-small.glb"
    position="30 -0.5 -40"
    rotation="0 -80 0"
    shadow="cast: true">
  </a-entity>




  <a-sound
    id="seaSound"
    src="url(see.mp3)"
    autoplay="false"
    loop="true"
    volume="1">
  </a-sound>

</a-scene>


<script>
  const scene = document.querySelector('a-scene');
  const seaSound = document.querySelector('#seaSound');

  function startSeaSound() {
    if (seaSound && seaSound.components.sound) {
      seaSound.components.sound.playSound();
    }
  }

  scene.addEventListener('loaded', function () {
    document.addEventListener('click', startSeaSound);
    document.addEventListener('keydown', startSeaSound);
  });
</script>

</body>
</html>
